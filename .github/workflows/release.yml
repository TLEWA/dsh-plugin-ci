name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to recover, for example v1.0.0
        required: true
        type: string
      dry_run:
        description: Build and verify only; do not create or update the GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    uses: ./.github/workflows/reusable-release.yml

  recover:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-release-recover.yml
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}

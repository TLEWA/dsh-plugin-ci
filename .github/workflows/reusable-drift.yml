name: reusable-drift

on:
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4
      - name: Check out the canonical policy
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ job.workflow_sha || github.sha }}
          path: .ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the local wiring
        run: node .ci/scripts/ci-gate.mjs --only=config.schema,wiring.workflows,wiring.repository
      - name: Compare the pinned major with the canonical release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .ci/scripts/check-drift.mjs --issue

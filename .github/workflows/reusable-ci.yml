name: reusable-ci

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON array of { os, node } combinations
        type: string
        required: false
        default: '[{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"windows-latest","node":20},{"os":"windows-latest","node":22},{"os":"windows-latest","node":24}]'
      separate-guard:
        description: 调用方已用独立的 pr-guard.yml 跑 guard 时设为 true；缺省 false 时 guard 仍在本 workflow 内运行，保持旧接线行为
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  pr-guard:
    # separate-guard=true 的调用方在 pr-guard.yml 里单独跑同一条检查；缺省 false 走旧接线，guard 仍在这里运行。
    if: ${{ !inputs.separate-guard && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the canonical gate
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ job.workflow_sha || github.sha }}
          path: .ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .ci/scripts/ci-gate.mjs --pr

  verify:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4
      - name: Check out the canonical gate
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ job.workflow_sha || github.sha }}
          path: .ci
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            echo "no lockfile, skipping install"
          fi
      - name: Gate (with artifact freshness)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node .ci/scripts/ci-gate.mjs
      - name: Gate (without artifact freshness)
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: node .ci/scripts/ci-gate.mjs --skip=artifacts.fresh

  ci-ok:
    if: always()
    needs: [pr-guard, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required check
        shell: bash
        run: |
          echo "pr-guard: ${{ needs.pr-guard.result }}"
          echo "verify: ${{ needs.verify.result }}"
          case "${{ needs.pr-guard.result }}" in
            success|skipped) ;;
            *) echo "::error::pr-guard 未通过：${{ needs.pr-guard.result }}"; exit 1 ;;
          esac
          test "${{ needs.verify.result }}" = "success"

name: drift

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare the local gate with the canonical one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_SOURCE: https://raw.githubusercontent.com/TLEWA/dsh-plugin-ci/main/scripts/ci-gate.mjs
        run: node scripts/sync-ci.mjs --check
